name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Serialised per tag, and deliberately never cancelled. Two runs of the same tag
# must not race to upload, but cancelling an in-flight publish is worse than the
# race: it can leave a release half-uploaded, and PyPI reserves every filename it
# has seen. `cancel-in-progress: false` is the whole point of this block.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag is not a review. This rebuilds and retests the tagged commit before
  # anything reaches PyPI, because a release is the one artefact that cannot be
  # taken back: a yank hides a file from resolvers without deleting it, and the
  # filename can never be reused.
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache, unlike CI. A cache entry written by an earlier pull-request
      # run could influence what gets published, and a release is the one
      # artefact that cannot be withdrawn. Resolving dependencies from scratch
      # costs a minute; it buys a build that depends on nothing but the lockfile.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
          enable-cache: false

      - name: Install
        run: uv sync --frozen --all-groups

      - name: Version matches the tag
        env:
          # Via env, never interpolated into the shell: a tag is attacker-
          # supplied on a public repo.
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "pyproject: $version   tag: $TAG"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match pyproject version $version." \
              "Bump the version and re-tag rather than publishing a mismatch."
            exit 1
          fi

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check

      - name: Test
        run: uv run pytest

      - name: Audit dependencies
        run: uv run pip-audit

      - name: Build
        run: uv build

      # The sdist of a pure-Python package is source that is already public, so
      # unlike the Rust client's there is nothing here it should not carry.
      # Checked anyway: a stray key or a local artefact swept into the tree
      # would otherwise ship to PyPI permanently.
      - name: Inspect what is about to be published
        run: |
          set -euo pipefail
          ls -la dist/
          echo "--- sdist ---"
          tar tzf dist/*.tar.gz
          echo "--- wheel ---"
          uv run python -c 'import glob, zipfile; print(chr(10).join(sorted(zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist())))'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish
    needs: [verify]
    runs-on: ubuntu-latest
    # A GitHub environment gives this a second gate: add a required reviewer in
    # repository settings and no tag can publish unattended.
    environment:
      name: pypi
      url: https://pypi.org/p/hippius-drive
    permissions:
      # PyPI trusted publishing exchanges this short-lived OIDC token for an
      # upload token, so no long-lived PyPI secret lives in this repo.
      id-token: write # PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # Publishes exactly the artefacts `verify` built and inspected; this job
      # never checks the repository out.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          print-hash: true
