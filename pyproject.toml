[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "hippius-drive"
version = "0.1.0"
description = "Python SDK and CLI for Hippius Drive (HCFS): end-to-end encrypted file storage"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "The Nerve Lab" }]
keywords = ["hippius", "hcfs", "storage", "encryption", "e2ee"]
dependencies = [
  "httpx==0.28.1",
  "pynacl==1.6.2",
  "blake3==1.0.9",
  "mnemonic==0.21",
  "cryptography==50.0.1",
  "argon2-cffi==25.1.0",
  "pydantic==2.13.5",
  "click==8.5.0",
  "tomli==2.4.1; python_version < '3.11'",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
  "Topic :: System :: Archiving",
  "Typing :: Typed",
]

[project.scripts]
hippius-drive = "hippius_drive.cli:main"

[project.urls]
Source = "https://github.com/thenervelab/hippius-drive-sdk"
Issues = "https://github.com/thenervelab/hippius-drive-sdk/issues"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "hypothesis==6.168.0",
  "respx==0.23.1",
  "ruff==0.16.7",
  "ty==0.0.80",
  "pip-audit==2.10.1",
]

[tool.hatch.build.targets.wheel]
packages = ["hippius_drive"]

[tool.hatch.build.targets.sdist]
include = ["hippius_drive", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
addopts = "-q -m 'not e2e'"
testpaths = ["tests"]
markers = ["e2e: hits the live Hippius service; needs HIPPIUS_TEST_TOKEN"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "D", "ANN", "S", "PL", "RUF"]
ignore = ["D203", "D213", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D", "ANN", "PLR2004", "S311"]
# N818 wants an Error suffix on every exception. These names are the SDK's
# published API and read as the condition they carry (`except NotFound:`),
# so the suffix is dropped deliberately rather than overlooked.
"hippius_drive/errors.py" = ["N818"]

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 8

[tool.ty.environment]
python-version = "3.10"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
possibly-unresolved-reference = "error"
